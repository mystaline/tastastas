name: release

# Builds the ONNX sidecar (Rust) + tastastas binary (Go) for every
# supported platform, then attaches them to a GitHub Release. Triggered
# manually or by pushing a `v*` tag — no remote is configured yet, so this
# workflow doesn't run until one is pushed and a tag lands.
#
# Matrix mirrors what `ort` (onnxruntime bindings) ships prebuilt binaries
# for via its download-binaries feature: linux x86_64/aarch64, macOS
# x86_64/aarch64, windows x86_64. No linux/arm or windows/arm64 — ort has
# no prebuilt runtime for those, would need self-built onnxruntime.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

env:
  GO_VERSION: "1.23"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-13
            goos: darwin
            goarch: amd64
            target: x86_64-apple-darwin
          - os: macos-latest
            goos: darwin
            goarch: arm64
            target: aarch64-apple-darwin
          - os: windows-latest
            goos: windows
            goarch: amd64
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Model + tokenizer are fetched once, baked into the sidecar binary
      # via include_bytes! at compile time (zero runtime file deps).
      - name: Download embedding model
        shell: bash
        run: |
          mkdir -p sidecar/assets
          curl -sL -o sidecar/assets/model.onnx \
            "https://huggingface.co/BAAI/bge-small-en-v1.5/resolve/main/onnx/model.onnx"
          curl -sL -o sidecar/assets/tokenizer.json \
            "https://huggingface.co/BAAI/bge-small-en-v1.5/resolve/main/tokenizer.json"

      - name: Build sidecar
        working-directory: sidecar
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage sidecar into go:embed path
        shell: bash
        run: |
          mkdir -p "internal/embed/bin/${{ matrix.goos }}_${{ matrix.goarch }}"
          bin="sidecar/target/${{ matrix.target }}/release/tastastas-embed"
          [ "${{ matrix.goos }}" = "windows" ] && bin="${bin}.exe"
          cp "$bin" "internal/embed/bin/${{ matrix.goos }}_${{ matrix.goarch }}/"

      - name: Build tastastas binary (sidecar baked in via go:embed)
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="tastastas-${{ matrix.goos }}-${{ matrix.goarch }}"
          [ "${{ matrix.goos }}" = "windows" ] && out="${out}.exe"
          go build -trimpath -ldflags="-s -w" -o "dist/$out" ./cmd/tastastas

      - uses: actions/upload-artifact@v4
        with:
          name: tastastas-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
