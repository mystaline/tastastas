name: release

# Covers all delivery methods from DEPLOYMENT.md:
#   1. All-in-one binary (sidecar + frontend + Go) — matrix of 4 platforms
#   2. Go+SPA binary (no sidecar) — wider matrix, static musl via zig (tree-sitter needs cgo)
#   3. Docker image — push to ghcr.io with semver + latest tags
#
# Triggered by:
#   - tag-release.yml (passes tag as input)
#   - push v* tag (manual git tag && git push)
#   - workflow_dispatch (dry-run, no uploads)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release (set by tag-release workflow)
        type: string
        required: false

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve-tag.outputs.value }}
      is_release: ${{ steps.resolve-tag.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag
        id: resolve-tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          if echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test ./...
      - run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Trivy fs scan (go.mod + frontend lockfiles)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build frontend (validate SPA builds cleanly)
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ── Delivery 1: all-in-one binary (sidecar + frontend + Go) ──────────
  binary-with-sidecar:
    needs: [test]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            goos: darwin
            goarch: arm64
            target: aarch64-apple-darwin
          - os: windows-latest
            goos: windows
            goarch: amd64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Download embedding model
        shell: bash
        run: |
          mkdir -p sidecar/assets
          curl -sL -o sidecar/assets/model.onnx \
            "https://huggingface.co/BAAI/bge-small-en-v1.5/resolve/main/onnx/model.onnx"
          curl -sL -o sidecar/assets/tokenizer.json \
            "https://huggingface.co/BAAI/bge-small-en-v1.5/resolve/main/tokenizer.json"

      - name: Build sidecar (Rust ONNX embedder)
        working-directory: sidecar
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage sidecar into go:embed path
        shell: bash
        run: |
          mkdir -p "internal/embed/bin/${{ matrix.goos }}_${{ matrix.goarch }}"
          bin="sidecar/target/${{ matrix.target }}/release/tastastas-embed"
          [ "${{ matrix.goos }}" = "windows" ] && bin="${bin}.exe"
          cp "$bin" "internal/embed/bin/${{ matrix.goos }}_${{ matrix.goarch }}/"

      - name: Build tastastas binary (sidecar baked in via go:embed)
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="tastastas-${{ matrix.goos }}-${{ matrix.goarch }}"
          [ "${{ matrix.goos }}" = "windows" ] && out="${out}.exe"
          go build -trimpath -ldflags="-s -w" -o "dist/$out" ./cmd/tastastas

      - name: Upload to release
        if: needs.test.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.test.outputs.tag }}
          files: dist/*
          generate_release_notes: true

  # ── Delivery 2: Go + SPA binary (no sidecar) ────────────────────────
  go-spa-binary:
    needs: [test]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: zig cc -target x86_64-linux-musl
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cc: zig cc -target aarch64-linux-musl
          - os: ubuntu-latest
            goos: linux
            goarch: arm
            goarm: "7"
            cc: zig cc -target arm-linux-musleabihf
          - os: ubuntu-latest
            goos: linux
            goarch: "386"
            cc: zig cc -target x86-linux-musl
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install zig (cross C compiler for static musl builds)
        if: matrix.cc != ''
        uses: ziglang/setup-zig@v2

      - name: Build tastastas binary (no sidecar)
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: |
          suffix=""
          [ "${{ matrix.goos }}" = "windows" ] && suffix=".exe"
          out="tastastas-nosidecar-${{ matrix.goos }}-${{ matrix.goarch }}${suffix}"
          go build -trimpath -ldflags="-s -w" -o "dist-nosidecar/$out" ./cmd/tastastas

      - name: Upload to release
        if: needs.test.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.test.outputs.tag }}
          files: dist-nosidecar/*

  # ── Delivery 3: Docker image ────────────────────────────────────────
  docker-image:
    needs: [test]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:scan
          labels: |
            org.opencontainers.image.version=${{ needs.test.outputs.tag }}

      - name: Trivy image scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}:scan
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Push image (after scan passes)
        if: needs.test.outputs.is_release == 'true'
        run: |
          img="${{ env.REGISTRY }}/${{ github.repository }}"
          ver="${{ needs.test.outputs.tag }}"; ver="${ver#v}"
          major="${ver%%.*}"; rest="${ver#*.}"; minor="${rest%%.*}"
          for t in "${{ needs.test.outputs.tag }}" latest "$major.$minor"; do
            docker tag "$img:scan" "$img:$t"
            docker push "$img:$t"
          done
