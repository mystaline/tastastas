name: tag-release

# Creates and pushes a v* tag, then triggers release.yml with the
# resolved tag so builds run against the exact tag (no race on ref).
#
# Usage:
#   gh workflow run tag-release.yml --field bump=patch
#   gh workflow run tag-release.yml --field version=v1.2.3
#   gh workflow run tag-release.yml --ref feat/feature-x --field bump=patch
#
# Branch awareness: releasing from any branch other than main appends
# -alpha to the tag (v1.2.3-alpha). Consumers pull pre-release builds via
# the :alpha docker tag; :latest is reserved for stable main releases.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (ignored when version is set)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Explicit tag (e.g. v1.2.3). Overrides bump.
        type: string
        required: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine tag
        id: tag
        run: |
          branch="${GITHUB_REF_NAME}"
          if [ -n "${{ inputs.version }}" ]; then
            base="${{ inputs.version }}"
          else
            latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            ver=${latest#v}
            ver=${ver%-alpha}
            IFS=. read -r major minor patch <<< "$ver"
            case "${{ inputs.bump }}" in
              major) base="v$((major + 1)).0.0"              ;;
              minor) base="v$major.$((minor + 1)).0"          ;;
              patch) base="v$major.$minor.$((patch + 1))"     ;;
            esac
          fi
          base=${base%-alpha}
          if [ "$branch" != "main" ]; then
            base="${base}-alpha"
          fi
          echo "value=$base" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Validate tag format
        run: |
          tag="${{ steps.tag.outputs.value }}"
          if ! echo "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-alpha)?$'; then
            echo "invalid tag: $tag (must be vMAJOR.MINOR.PATCH, optional -alpha)"
            exit 1
          fi

      - name: Create and push tag
        run: |
          tag="${{ steps.tag.outputs.value }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists"
            exit 1
          fi
          git tag "$tag"
          git push origin "$tag"

      - name: Trigger release workflow
        run: |
          gh workflow run release.yml --field tag="${{ steps.tag.outputs.value }}"
        env:
          GH_TOKEN: ${{ github.token }}
