services:
  tastastas:
    build: .
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${GRAPH_PORT:-9292}:9292"
    volumes:
      - tastastas-data:/data
    # Uncomment below to override embedded frontend with local build:
    # run `cd frontend && npm ci && npm run build` first
    #   - ./frontend/dist:/app/spa
    # environment:
    #   - TASTASTAS_SPA_DIR=/app/spa
    # Embed backend override: set TASTASTAS_EMBED=openai to use OpenAI,
    # TASTASTAS_EMBED=ollama for Ollama (needs separate ollama service).
    # Default "none" = lexical-only (FTS5, no vector search).
    command:
      - "--serve"
      - ":8080"
      - "--db"
      - "/data/memory.db"
      - "--embed-backend"
      - "${TASTASTAS_EMBED:-none}"
      - "--graph-addr"
      - ":9292"
    environment:
      - TASTASTAS_AUTH_TOKEN=${TASTASTAS_AUTH_TOKEN:-}
      - TASTASTAS_OPENAI_KEY=${TASTASTAS_OPENAI_KEY:-}

volumes:
  tastastas-data:
