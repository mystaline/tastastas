services:
  tastastas:
    build: .
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${GRAPH_PORT:-9292}:9292"
    volumes:
      - tastastas-data:/data
      - ${WORKSPACE_MOUNT:-/home/mystaline-dev/Workspace}:/workspaces
    # Uncomment below to override embedded frontend with local build:
    # run `cd frontend && npm ci && npm run build` first
    #   - ./frontend/dist:/app/spa
    # environment:
    #   - TASTASTAS_SPA_DIR=/app/spa
    # Embed backend override: set TASTASTAS_EMBED=openai to use OpenAI,
    # TASTASTAS_EMBED=ollama for Ollama (needs separate ollama service).
    # Default "none" = lexical-only (FTS5, no vector search).
    #
    # See DEPLOYMENT.md for flags, hardware tuning, and a ready-made
    # production compose using a pushed image (docker-compose.prod.yml).
    command:
      - "--serve"
      - ":8080"
      - "--db"
      - "/data/memory.db"
      - "--embed-backend"
      - "${TASTASTAS_EMBED:-none}"
      - "--graph-addr"
      - ":9292"
      - "--consolidate-interval"
      - "${TASTASTAS_CONSOLIDATE:-1h}"
    environment:
      - TASTASTAS_AUTH_TOKEN=${TASTASTAS_AUTH_TOKEN:-}
      - TASTASTAS_OPENAI_KEY=${TASTASTAS_OPENAI_KEY:-}
      - SERVER_WORKSPACE_ROOT=/workspaces
      - GOPRIVATE=${GOPRIVATE:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tastastas-data:
