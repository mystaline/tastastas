services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama-init:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        echo "Pulling nomic-embed-text..."
        ollama pull nomic-embed-text
        echo "Model ready."
    environment:
      - OLLAMA_HOST=ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  tastastas:
    build: .
    ports:
      - "${TASTASTAS_PORT:-8080}:8080"
      - "${GRAPH_PORT:-9292}:9292"
    volumes:
      - tastastas-data:/data
    command:
      - "--serve"
      - ":8080"
      - "--db"
      - "/data/memory.db"
      - "--embed-backend"
      - "ollama"
      - "--ollama-url"
      - "http://ollama:11434"
      - "--embed-dim"
      - "768"
      - "--graph-addr"
      - ":9292"
    environment:
      - TASTASTAS_AUTH_TOKEN=${TASTASTAS_AUTH_TOKEN:-}
      - TASTASTAS_OPENAI_KEY=${TASTASTAS_OPENAI_KEY:-}
    depends_on:
      ollama-init:
        condition: service_completed_successfully

volumes:
  tastastas-data:
  ollama-models:
