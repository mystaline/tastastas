[package]
name = "tastastas-embed"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tastastas-embed"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true

[dependencies]
ort = { version = "2.0.0-rc.9", features = ["download-binaries"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ndarray = "0.16"
