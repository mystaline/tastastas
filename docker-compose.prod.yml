services:
  tastastas:
    image: ${TASTASTAS_IMAGE:-ghcr.io/mystaline/tastastas:latest}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${GRAPH_PORT:-9292}:9292"
    volumes:
      - tastastas-data:/data
      - ${WORKSPACE_MOUNT:-/home/mystaline-dev/Workspace}:${SERVER_WORKSPACE_ROOT:-/workspaces}
    command:
      - "--serve"
      - ":8080"
      - "--db"
      - "/data/memory.db"
      - "--embed-backend"
      - "openai"
      - "--openai-base-url"
      - "${TASTASTAS_OPENAI_BASE_URL:-https://openrouter.ai/api/v1}"
      - "--openai-model"
      - "${TASTASTAS_OPENAI_MODEL:-nvidia/nemotron-3-embed-1b:free}"
      - "--graph-addr"
      - ":9292"
      - "--consolidate-interval"
      - "${TASTASTAS_CONSOLIDATE:-1h}"
    environment:
      - TASTASTAS_AUTH_TOKEN=${TASTASTAS_AUTH_TOKEN:-}
      - TASTASTAS_OPENAI_KEY=${TASTASTAS_OPENAI_KEY:-}
      - SERVER_WORKSPACE_ROOT=${SERVER_WORKSPACE_ROOT:-/workspaces}
      - GOPRIVATE=${GOPRIVATE:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tastastas-data:
